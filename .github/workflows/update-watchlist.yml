name: Daily Watchlist Update

on:
  schedule:
    - cron: '17 5 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-watchlist:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Prepare watchlist-data branch
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git ls-remote --exit-code --heads origin watchlist-data; then
            git fetch origin watchlist-data
            git worktree add data-branch origin/watchlist-data
            cd data-branch && git checkout -B watchlist-data
          else
            git worktree add --detach data-branch
            cd data-branch
            git checkout --orphan watchlist-data
            git rm -rf --quiet . || true
            cp ../public/data/movies.json ../public/data/version.json .
          fi

      - name: Sync Letterboxd watchlist with TMDB
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          WATCHLIST_DATA_DIR: data-branch
        run: node scripts/update-watchlist.mjs

      - name: Push to watchlist-data branch
        working-directory: data-branch
        run: |
          git add movies.json version.json
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "chore: watchlist data update"
          git push origin watchlist-data
